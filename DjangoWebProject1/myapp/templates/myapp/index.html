<html>
<head>
    <title></title>

<body>

    <button id="win" type="button">Win</button>
    <button id="lose" type="button">Lose</button>
    <button id="draw" type="button">Draw</button>
    <p name="winpercent" id="wp"></p>
    <p name="losepercent" id="lp"></p>
    <p name="drawpercent" id="dp"></p>
    <p name="currency" id="currency"></p>
    <script>
        chatSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);

            wpp = Number(data.wpp);
            lpp = Number(data.lpp);
            dpp = Number(data.dpp);

            localStorage.setItem("wpp", wpp);
            localStorage.setItem("lpp", lpp);
            localStorage.setItem("dpp", dpp);

            updatePercentages();
        };
        wpp = parseInt(localStorage.getItem('wpp')) || 0;
        lpp = parseInt(localStorage.getItem('lpp')) || 0;
        dpp = parseInt(localStorage.getItem('dpp')) || 0;
        var lastClicked = null;
        var oo = 100;
        function updatePercentages() {
            var total = wpp + lpp + dpp;
            var winpercent = Number(((wpp / total) * 100).toFixed(1))
            var losepercent = Number(((lpp / total) * 100).toFixed(1))
            var drawpercent = Number(((dpp / total) * 100).toFixed(1))
            document.getElementById('wp').innerHTML = "Win Percentage: " + winpercent + "%";
            document.getElementById('lp').innerHTML = "Lose Percentage: " + losepercent + "%";
            document.getElementById('dp').innerHTML = "Draw Percentage: " + drawpercent + "%";
            localStorage.setItem('winpercent', winpercent);
            localStorage.setItem('losepercent', losepercent);
            localStorage.setItem('drawpercent', drawpercent);
        }
        function sendPercentages() {
            if (chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({
                    "wpp": wpp,
                    "lpp": lpp,
                    "dpp": dpp,
                }));
            }
        }

        var total = wpp + lpp + dpp;
        document.getElementById('win').onclick = function () {
            wpp++;
            updatePercentages();
            sendPercentages();
            localStorage.setItem('lastClicked', 'win');
        };
        document.getElementById('lose').onclick = function () {
            lpp++;
            updatePercentages();
            sendPercentages();
            localStorage.setItem('lastClicked', 'lose');
        };
        document.getElementById('draw').onclick = function () {
            dpp++;
            updatePercentages();
            sendPercentages();
            localStorage.setItem('lastClicked', 'win');
        };




    </script>

    <p name="demo" id="demo"></p>
    <p name="history" id="history"></p>

        {% csrf_token %}
